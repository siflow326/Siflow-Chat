<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siflow Chat - AI Workspace</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-sidebar: #111827;
            --bg-panel: #1f2937;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        .screen { display: none; width: 100%; height: 100vh; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .screen.active { display: flex; }

        #welcome-screen { text-align: center; background: radial-gradient(circle at center, #1e293b 0%, var(--bg-main) 100%); }
        .logo-title { font-size: 3rem; font-weight: 800; color: var(--text-main); letter-spacing: 2px; margin-bottom: 10px; }
        .logo-title span { color: var(--accent-blue); text-shadow: 0 0 20px var(--accent-glow); }
        .welcome-subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        
        .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 12px 30px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--accent-blue); }

        #app-screen { flex-direction: row; padding: 0; }
        
        /* تعديل القائمة الجانبية لتكون في اليمين بشكل صحيح ودائم */
        sidebar { width: 260px; min-width: 260px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; gap: 15px; height: 100vh; z-index: 10; }
        .new-chat-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; text-align: right; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 600; transition: background 0.2s; }
        .new-chat-btn:hover { background: var(--bg-panel); }

        main { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-main); position: relative; overflow: hidden; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        .message { padding: 15px 20px; border-radius: 12px; max-width: 85%; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
        .message.user { background-color: var(--bg-panel); align-self: flex-start; border: 1px solid var(--border-color); }
        .message.bot { background-color: rgba(59, 130, 246, 0.1); align-self: flex-end; border: 1px solid rgba(59, 130, 246, 0.3); }

        .input-area { padding: 15px 20px; width: 100%; display: flex; justify-content: center; background: var(--bg-main); }
        .input-wrapper { width: 100%; max-width: 800px; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; padding: 10px 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .input-wrapper textarea { background: transparent; border: none; color: var(--text-main); resize: none; font-size: 1rem; outline: none; min-height: 24px; max-height: 150px; line-height: 1.5; }
        .input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .tool-icons { display: flex; gap: 15px; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; }
        .send-btn { background: var(--accent-blue); color: white; border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: #2563eb; }

        /* متجاوب مع الهواتف الذكية */
        @media (max-width: 768px) {
            sidebar { display: none; } /* إخفاء الجانبية مؤقتاً في الشاشات الصغيرة لتشمل مساحة الدردشة كاملة، يمكن إضافتها بزر قائمة لاحقاً */
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="welcome-screen" class="screen active">
        <h1 class="logo-title">SI<span>FLOW</span></h1>
        <p class="welcome-subtitle">Your AI. Your Ideas. Your World.</p>
        <button class="btn-primary" onclick="goToApp()">Get Started →</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="app-screen" class="screen">
        <sidebar>
            <button class="new-chat-btn" onclick="newChat()">
                <span>New Chat</span>
                <span>+</span>
            </button>
            <div style="flex:1; overflow-y:auto; font-size: 0.9rem; color: var(--text-muted);">
                <p style="padding: 5px 0; font-weight: bold; color: var(--text-main);">Recent Chats</p>
                <div style="padding: 8px; cursor: pointer; border-radius: 4px; background: rgba(255,255,255,0.03); margin-top: 5px;">كيفية تعلم البرمجة</div>
                <div style="padding: 8px; cursor: pointer; border-radius: 4px; margin-top: 5px;">تصميم واجهة Siflow</div>
            </div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; font-size: 0.85rem; color: var(--text-muted);">
                أسامة سيف الدين (V1)
            </div>
        </sidebar>
        
        <main>
            <div class="chat-header">
                <span>Siflow Chat</span>
                <span style="font-size: 0.85rem; color: var(--accent-blue);">Online</span>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="chat-container" id="chatContainer">
                    <div class="message bot">مرحباً بك في Siflow Chat. كيف يمكنني مساعدتك اليوم؟</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Ask Siflow anything..." rows="1" oninput="autoResize(this)"></textarea>
                    <div class="input-actions">
                        <div class="tool-icons">
                            <span>📎 Attach</span>
                            <span>🎤 Voice</span>
                        </div>
                        <button class="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function goToApp() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const text = input.value.trim();
            if(!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            input.style.height = 'auto';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot';
                container.appendChild(botDiv);
                
                let reply = "أهلاً بك! لقد تم ضبط واجهة Siflow Chat لتكون متناسقة تماماً مع شاشات الهواتف والحواسيب.";
                let i = 0;
                function typeWriter() {
                    if (i < reply.length) {
                        botDiv.textContent += reply.charAt(i);
                        i++;
                        container.scrollTop = container.scrollHeight;
                        setTimeout(typeWriter, 20);
                    }
                }
                typeWriter();
            }, 500);
        }

        function newChat() {
            document.getElementById('chatContainer').innerHTML = '<div class="message bot">محادثة جديدة جاهزة. تفضل بطرح سؤالك!</div>';
        }
    </script>
</body>
</html>
